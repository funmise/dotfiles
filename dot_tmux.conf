# remap prefix from 'C-b' to 'C-Space'
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# split panes using \ and -
bind \\ split-window -h
bind - split-window -v
unbind '"'
unbind %

# reload config file
bind r source-file ~/.tmux.conf

# switch panes using Shift-arrow without prefix
bind -n S-Left  select-pane -L
bind -n S-Right select-pane -R
bind -n S-Up    select-pane -U
bind -n S-Down  select-pane -D

# resize panes using prefix + Shift-arrow
bind -r S-Left  resize-pane -L 1
bind -r S-Right resize-pane -R 1
bind -r S-Up    resize-pane -U 1
bind -r S-Down  resize-pane -D 1

# Copy text selected with the mouse to the macOS clipboard.
# copy-command tells tmux to send copied text through pbcopy.
# Disable tmux's terminal clipboard method because pbcopy handles it instead.
set -s copy-command 'pbcopy'
set -s set-clipboard off
